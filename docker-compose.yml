services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: attendance-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Dataset:/app/Dataset
      - attendance_data:/app/data
    environment:
      - DISABLE_TTS=true
      - ATTENDANCE_CSV=/app/data/attendance.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: attendance-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - PROCESS_INTERVAL_SEC=2.5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  attendance_data:
